name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, intl, mbstring, pdo_sqlite, zip, exif
          coverage: none
      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Pint (code style)
        run: vendor/bin/pint --test
      - name: Larastan (level 5, baseline for known backlog)
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress

  tests:
    name: Pest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, intl, mbstring, pdo_sqlite, zip, exif
          coverage: none
      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build assets (views reference the Vite manifest)
        run: npm run build
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run the suite (in-memory SQLite, outbound HTTP faked)
        run: vendor/bin/pest --parallel --compact
      - name: Check every spec test ID is accounted for
        run: |
          python3 tools/test-matrix.py
          git diff --exit-code docs/TEST-MATRIX.md || (echo "docs/TEST-MATRIX.md is stale — run python tools/test-matrix.py" && exit 1)

  databases:
    name: Migrations on ${{ matrix.db }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mysql
            port: 3306
          - db: pgsql
            port: 5432
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: qcamelmc
          MYSQL_ROOT_PASSWORD: secret
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret" --health-interval=5s --health-retries=20
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: qcamelmc
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: --health-cmd="pg_isready" --health-interval=5s --health-retries=20
    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: qcamelmc
      DB_USERNAME: ${{ matrix.db == 'mysql' && 'root' || 'postgres' }}
      DB_PASSWORD: secret
      # No Redis service in this job: keep cache/queue/session/broadcast in-process.
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      BROADCAST_CONNECTION: 'null'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, intl, mbstring, pdo_mysql, pdo_pgsql, zip, exif
          coverage: none
      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Migrate and seed from scratch (CHECK constraints apply here, unlike SQLite)
        run: php artisan migrate:fresh --seed --force
      - name: Roll everything back and migrate again
        run: |
          php artisan migrate:rollback --force
          php artisan migrate --force

  image:
    name: Docker image builds
    runs-on: ubuntu-24.04
    needs: [quality, tests, databases]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
