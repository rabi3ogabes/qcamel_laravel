; Production PHP settings for the ticketing app.
date.timezone = UTC                 ; the app converts to Asia/Qatar explicitly (QatarClock)
expose_php = Off
memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 12M           ; receipt photos / event images (10 MB app limit)
post_max_size = 14M

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0     ; immutable image: clear by redeploying
opcache.jit = tracing
opcache.jit_buffer_size = 64M

session.cookie_httponly = 1
session.cookie_secure = 1

ping.path = /ping
